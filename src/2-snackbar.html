<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise generator</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <main class="page-content">
      <a class="back-link" href="./index.html">Go back</a>
      <section class="task-section">
        <h1>Promise generator</h1>
        <form class="form">
          <label>Delay (ms)<input type="number" name="delay" required /></label>
          <fieldset>
            <legend>State</legend>
            <label><input type="radio" name="state" value="fulfilled" required /> Fulfilled</label>
            <label><input type="radio" name="state" value="rejected" required /> Rejected</label>
          </fieldset>
          <button type="submit">Create notification</button>
        </form>
      </section>
    </main>
    <script type="module" src="./js/2-snackbar.js"></script>
  </body>
</html>
